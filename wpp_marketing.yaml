openapi: 3.0.3
info:
  title: WhatsApp Business API - WPP Marketing
  description: |
    WPP Marketing is a platform for automating WhatsApp Business messages.

    With this API you can:
    - Send text messages.
    - Send media files (images, documents, etc).
    - Retrieve sent message logs.
    - Retrieve webhook delivery logs.

    For more information, visit [https://wppmarketing.com/developers](https://wppmarketing.com/developers)
  version: 1.0.0


servers:
  - url: https://api.wppmarketing.com
    description: Production
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/wppmarketing/WPP/1.0.0

paths:
  /send-text:
    post:
      operationId: sendTextMessage
      summary: Send Text Message
      description: Sends a plain text message to a WhatsApp number.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextMessage'
      responses:
        '200':
          description: Message accepted by the configured WhatsApp connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled or scope insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Message service unavailable or rejected the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Idempotency or internal service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /send-media:
    post:
      operationId: sendMediaMessage
      summary: Send Media Message
      description: |
        Sends an image, audio, video or document to a WhatsApp number.
        The media URL must use HTTPS, resolve only to public addresses and end with a supported extension.
        Official connections use the configured image template for images. Audio, video and document
        are sent as Cloud API session messages and therefore require an open customer-service window.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaMessage'
            examples:
              audio:
                summary: Send an audio file
                value:
                  number: '5511999999999'
                  url_type: 'https://cdn.example.com/audio/customer-update.mp3'
                  media_type: audio
              imageWithCaption:
                summary: Send an image with a caption
                value:
                  number: '5511999999999'
                  body: 'Your order is ready.'
                  url_type: 'https://cdn.example.com/images/order-ready.jpg'
                  media_type: image
      responses:
        '200':
          description: Media message accepted by the configured WhatsApp connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled or scope insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid media URL, type or file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Message service unavailable or rejected the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Idempotency or internal service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /messages:
    get:
      summary: Retrieve Sent Messages
      description: Returns sent messages with delivery status and metadata using offset pagination.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of sent messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
              example:
                max: 27
                itens:
                  - id: 417452
                    status: Sucesso
                    delivery_status: READ
                    to: "555181721240"
                    body: "Hello! This is a plain text message."
                    type: text
                    media_url: null
                    message_id: "3EB0191CBAFD6A71DD7696"
                    error_code: null
                    meta_error_code: null
                    error_message: null
                    official_api: true
                    automation_id: 42
                    created: "2025-08-04T21:13:31Z"
                    updated: "2025-08-04T21:13:37Z"
                pagination:
                  limit: 1
                  offset: 0
                  count: 1
                  total: 27
                  has_more: true
                  next_offset: 1
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled or scope insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: Unable to retrieve messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks:
    get:
      operationId: listWebhookDeliveries
      summary: Retrieve Webhook Deliveries
      description: |
        Returns the authenticated account's webhook delivery history using offset pagination.
        Events use the same public contract regardless of which WhatsApp connection originated them.
        Provider details are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of webhook deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveriesResponse'
              example:
                max: 12
                itens:
                  - id: evt_0123456789abcdef0123456789abcdef
                    event: MESSAGE_DELIVERED
                    timestamp: '2026-09-15T10:30:00Z'
                    message:
                      id: msg_123
                      status: delivered
                      phone: '5511999999999'
                    delivery:
                      endpoint: https://example.com/webhooks/wpp
                      status: delivered
                      attempts: 1
                      http_status: 204
                      last_error: null
                      next_attempt_at: null
                      last_attempt_at: '2026-09-15T10:30:04Z'
                      delivered_at: '2026-09-15T10:30:04Z'
                    created: '2026-09-15T10:30:00Z'
                    updated: '2026-09-15T10:30:04Z'
                pagination:
                  limit: 1
                  offset: 0
                  count: 1
                  total: 12
                  has_more: true
                  next_offset: 1
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled or webhooks:read scope insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          description: Unable to retrieve webhook deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  responses:
    RateLimitExceeded:
      description: Request limit exceeded. Retry after the number of seconds indicated by Retry-After.
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window resets.
          schema:
            type: integer
        RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: rate_limit_exceeded
            message: Rate limit exceeded

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Use a scoped integration credential. Required scopes are messages:write, messages:read or webhooks:read according to the operation.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records returned. Defaults to 100 and cannot exceed 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip before returning results.
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key for safely retrying the same request for 48 hours. Reusing it with a different body returns HTTP 409.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'

  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
          description: Stable machine-readable error code.
          example: invalid_token
        message:
          type: string
          description: Human-readable error description.
          example: Invalid, expired or revoked token
        details:
          type: object
          additionalProperties: true
          description: Optional safe context about the error.

    TextMessage:
      type: object
      required:
        - number
        - body
      properties:
        number:
          type: string
          example: '5511999999999'
        body:
          type: string
          example: 'Hello! This is a plain text message.'

    MediaMessage:
      type: object
      required:
        - number
        - url_type
      properties:
        number:
          type: string
          example: '5511999999999'
        body:
          type: string
          description: Optional caption. Some media types, such as audio, may be sent without a caption.
          example: 'Check out this image!'
        url_type:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: |
            Public HTTPS URL ending with a supported extension.
            Images: JPG, JPEG, PNG, GIF, WEBP.
            Audio: MP3, WAV, OGG.
            Video: MP4.
            Documents: PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, TXT, ZIP, RAR.
          example: 'https://yoursite.com/image.jpg'
        media_type:
          type: string
          description: Optional explicit media category. When provided, it must match the URL extension.
          enum:
            - image
            - audio
            - video
            - document
          example: image

    MessageResponse:
      type: object
      properties:
        status:
          type: string
        importance:
          type: integer
        from:
          type: string
        to:
          type: string
        body:
          type: string
        type:
          type: string
        caption:
          type: string
          nullable: true
        mimetype:
          type: string
        uuid:
          type: string
        expire:
          type: string
          format: date-time
        id:
          type: integer
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time

    MessagesResponse:
      type: object
      properties:
        max:
          type: integer
        itens:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              status:
                type: string
              delivery_status:
                type: string
              to:
                type: string
              body:
                type: string
              type:
                type: string
              media_url:
                type: string
                nullable: true
              message_id:
                type: string
                nullable: true
              error_code:
                type: string
                nullable: true
              meta_error_code:
                type: string
                nullable: true
              error_message:
                type: string
                nullable: true
              official_api:
                type: boolean
              automation_id:
                type: integer
                nullable: true
              created:
                type: string
                format: date-time
              updated:
                type: string
                format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'

    WebhookDeliveriesResponse:
      type: object
      required:
        - max
        - itens
        - pagination
      properties:
        max:
          type: integer
          description: Total webhook delivery records for the authenticated account.
        itens:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        pagination:
          $ref: '#/components/schemas/Pagination'

    WebhookDelivery:
      type: object
      required:
        - id
        - event
        - timestamp
        - message
        - delivery
        - created
        - updated
      properties:
        id:
          type: string
          description: Stable identifier for this logical event.
          example: evt_0123456789abcdef0123456789abcdef
        event:
          type: string
          enum:
            - MESSAGE_CREATED
            - MESSAGE_DELIVERED
            - MESSAGE_READ
            - MESSAGE_ERROR
        timestamp:
          type: string
          format: date-time
          description: Time when the message event occurred.
        message:
          $ref: '#/components/schemas/WebhookMessage'
        delivery:
          $ref: '#/components/schemas/WebhookDeliveryResult'
        created:
          type: string
          format: date-time
          description: Time when the delivery record was created.
        updated:
          type: string
          format: date-time
          description: Time when the delivery record was last updated.

    WebhookMessage:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Message identifier used to correlate status updates.
        status:
          type: string
          enum:
            - created
            - delivered
            - read
            - error
        phone:
          type: string
          pattern: '^[0-9]+$'
          description: Destination number containing digits only, when available.
        error:
          type: string
          description: Normalized error description, returned only for MESSAGE_ERROR when available.

    WebhookDeliveryResult:
      type: object
      required:
        - endpoint
        - status
        - attempts
        - http_status
        - last_error
        - next_attempt_at
        - last_attempt_at
        - delivered_at
      properties:
        endpoint:
          type: string
          format: uri
          description: Customer endpoint used for the delivery.
        status:
          type: string
          enum:
            - pending
            - processing
            - retry
            - delivered
            - failed
        attempts:
          type: integer
          minimum: 0
        http_status:
          type: integer
          nullable: true
          minimum: 100
          maximum: 599
        last_error:
          type: string
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true

    Pagination:
      type: object
      required:
        - limit
        - offset
        - count
        - has_more
        - next_offset
      properties:
        limit:
          type: integer
          example: 100
        offset:
          type: integer
          example: 0
        count:
          type: integer
          example: 100
        total:
          type: integer
          nullable: true
          description: Total records reported by the internal service when available.
          example: 245
        has_more:
          type: boolean
          example: true
        next_offset:
          type: integer
          nullable: true
          example: 100
